services:
  stashlock-servergo:
    build: .
    ports:
      - "8099:8080"
    environment:
      - STASHLOCK_PORT=8080
      - STASHLOCK_WORK_DIR=/app/work
      - STASHLOCK_MASTER_KEY=${STASHLOCK_MASTER_KEY:-}
      - STASHLOCK_ALLOWED_ORIGINS=${STASHLOCK_ALLOWED_ORIGINS:-}
      - STASHLOCK_ADMIN_NETWORKS=${STASHLOCK_ADMIN_NETWORKS:-}
      - STASHLOCK_TRUSTED_PROXIES=${STASHLOCK_TRUSTED_PROXIES:-}
      - STASHLOCK_LOG_DIR=/app/log
    volumes:
      - ./app/work:/app/work
      - ./app/log:/app/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/stashlock-servergo", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
