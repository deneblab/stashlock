{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>StashLock Admin</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <script>
    (function(){
        try{var t=localStorage.getItem('stashlock-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}
    })();
    </script>
</head>
<body>
<div class="app">
    {{if .IsLoggedIn}}
    <header class="topbar">
        <a class="brand" href="/admin"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>StashLock <small>{{.Version}}</small></a>
        <span class="spacer"></span>
        <span class="health" id="health" role="status" title="GET /healthz every 30 s"><span class="dot"></span><span id="health-text">Checking…</span></span>
        {{if .Admin}}<span class="who" title="Signed in with admin key {{.Admin.KeyPrefix}}…"><span class="pill accent">Admin</span><span class="txt">{{.Admin.Name}}</span></span>{{end}}
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <form method="post" action="/admin/logout"><button type="submit" class="btn ghost sm">Log out</button></form>
    </header>
    <nav class="tabs" aria-label="Dashboard sections">
        <a class="tab" href="/admin" {{if eq .ActiveTab "overview"}}aria-current="page"{{end}}>Overview</a>
        <a class="tab" href="/admin/boxes" {{if eq .ActiveTab "boxes"}}aria-current="page"{{end}}>Boxes</a>
        <a class="tab" href="/admin/keys" {{if eq .ActiveTab "keys"}}aria-current="page"{{end}}>Keys</a>
        <a class="tab" href="/admin/audit" {{if eq .ActiveTab "audit"}}aria-current="page"{{end}}>Audit</a>
    </nav>
    <main class="main">
        {{template "content" .}}
    </main>
    {{else}}
    {{template "content" .}}
    {{end}}
</div>

<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<dialog id="drawer" class="drawer" aria-labelledby="drawer-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/static/lib/htmx/htmx.min.js"></script>
<script>
(function(){
    "use strict";
    var toastEl=document.getElementById('toast'),toastTimer;
    window.showToast=function(msg){
        toastEl.textContent=msg;toastEl.hidden=false;
        clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.hidden=true;},4000);
    };

    // Dialogs: content is swapped in by htmx, then shown as a modal (Esc and focus handled natively)
    ['dialog','drawer'].forEach(function(id){
        var d=document.getElementById(id);
        d.addEventListener('click',function(e){
            if(e.target===d||e.target.closest('[data-close]'))d.close();
        });
        d.addEventListener('htmx:afterSwap',function(e){if(e.target===d&&!d.open)d.showModal();});
    });
    document.body.addEventListener('closeDialog',function(){
        ['dialog','drawer'].forEach(function(id){var d=document.getElementById(id);if(d.open)d.close();});
    });
    document.body.addEventListener('toast',function(e){showToast(e.detail.value||e.detail);});

    // Errors: show the server's message next to the form that caused it, otherwise as a toast
    document.body.addEventListener('htmx:responseError',function(e){
        var msg=(e.detail.xhr.responseText||'').trim()||('Request failed ('+e.detail.xhr.status+')');
        var src=e.detail.elt,box=src&&src.closest('dialog')&&src.closest('dialog').querySelector('.dialog-error');
        if(box){box.innerHTML='<div class="alert bad" role="alert"><div class="grow"></div></div>';box.querySelector('.grow').textContent=msg;}
        else showToast(msg);
    });
    document.body.addEventListener('htmx:sendError',function(){showToast('The server is not reachable. Check the connection and try again.');});

    // Copy buttons: data-copy="#id" copies that element's text
    document.addEventListener('click',function(e){
        var b=e.target.closest('[data-copy]');if(!b)return;
        var el=document.querySelector(b.getAttribute('data-copy'));if(!el)return;
        var text=el.textContent.trim();
        var done=function(){showToast('Copied to clipboard');};
        if(navigator.clipboard&&navigator.clipboard.writeText){
            navigator.clipboard.writeText(text).then(done,function(){selectText(el);});
        }else selectText(el);
    });
    function selectText(el){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);showToast('Press Ctrl+C to copy');}

    // Times: server renders UTC in <time datetime>; show local time, keep UTC in the tooltip
    function localTimes(root){
        (root||document).querySelectorAll('time[datetime]:not([data-done])').forEach(function(t){
            var d=new Date(t.getAttribute('datetime'));if(isNaN(d))return;
            t.title=t.getAttribute('datetime').replace('T',' ').replace(/\.\d+/,'').replace('Z',' UTC');
            if(t.hasAttribute('data-relative')){t.textContent=relative(d);}
            else t.textContent=d.toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
            t.setAttribute('data-done','');
        });
    }
    function relative(d){
        var s=(Date.now()-d.getTime())/1000,f=s<0,a=Math.abs(s),u;
        if(a<60)return f?'in a moment':'just now';
        if(a<3600)u=[Math.round(a/60),'min'];else if(a<86400)u=[Math.round(a/3600),'h'];else u=[Math.round(a/86400),'day'+(Math.round(a/86400)===1?'':'s')];
        return f?'in '+u[0]+' '+u[1]:u[0]+' '+u[1]+' ago';
    }
    localTimes();
    document.body.addEventListener('htmx:afterSwap',function(e){localTimes(e.target);});

    // Health: poll /healthz and show the real state
    var health=document.getElementById('health');
    if(health){
        var txt=document.getElementById('health-text');
        var check=function(){
            var t0=performance.now();
            fetch('/healthz',{cache:'no-store'}).then(function(r){
                if(!r.ok)throw new Error();
                health.className='health ok';txt.textContent='Online · '+Math.round(performance.now()-t0)+' ms';
            }).catch(function(){health.className='health off';txt.textContent='Server unreachable';});
        };
        check();setInterval(check,30000);
    }

    // Theme: system by default; the toggle stores an explicit choice
    var tb=document.getElementById('theme-toggle');
    if(tb)tb.addEventListener('click',function(){
        var r=document.documentElement,c=r.getAttribute('data-theme');
        var dark=c?c==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
        var next=dark?'light':'dark';r.setAttribute('data-theme',next);
        try{localStorage.setItem('stashlock-theme',next);}catch(e){}
    });
})();
</script>
{{template "scripts" .}}
</body>
</html>{{end}}
{{define "scripts"}}{{end}}
