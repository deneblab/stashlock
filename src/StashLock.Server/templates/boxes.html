{{define "content"}}
<div class="page-head">
    <h1>Boxes</h1>
    <p>Encrypted secrets addressed as box.tag.version. Values stay encrypted; the dashboard never shows plaintext.</p>
</div>
<section class="card">
    <form class="toolbar" id="box-filters" hx-get="/admin/boxes/list" hx-target="#box-list" hx-trigger="change, input changed delay:300ms from:#f-q, refresh from:body" onsubmit="return false">
        <div class="field"><label for="f-box">Box</label>
            <select class="input" id="f-box" name="box"><option value="">All boxes</option>{{range .Data.Boxes}}<option>{{.}}</option>{{end}}</select></div>
        <div class="field"><label for="f-tag">Tag</label>
            <select class="input" id="f-tag" name="tag"><option value="">All tags</option>{{range .Data.Tags}}<option>{{.}}</option>{{end}}</select></div>
        <div class="field"><label for="f-q">Search</label><input class="input mono" id="f-q" name="q" type="search" placeholder="exampleapp.dev…" autocomplete="off"></div>
        <label class="check" style="align-self:center"><input type="checkbox" id="f-deleted" name="deleted" value="1"><span>Show deleted</span></label>
    </form>
    <div id="box-list" hx-get="/admin/boxes/list" hx-trigger="load" hx-include="#box-filters">
        <div class="card-b"><div class="skeleton" style="width:60%"></div></div>
    </div>
</section>
{{end}}
