{{define "content"}}
<div class="page-head">
    <h1>Keys</h1>
    <nav class="seg" aria-label="Key type">
        <a href="/admin/keys" {{if not .Data.Admin}}aria-current="page"{{end}}>API keys</a>
        <a href="/admin/keys?type=admin" {{if .Data.Admin}}aria-current="page"{{end}}>Admin keys</a>
    </nav>
    <span class="spacer"></span>
    <button class="btn" type="button" hx-get="/admin/keys/new{{if .Data.Admin}}?type=admin{{end}}" hx-target="#dialog">{{if .Data.Admin}}Create admin key{{else}}Create API key{{end}}</button>
    <p>API keys let apps and CI read or publish one box.tag. Admin keys manage this dashboard and cannot read secrets.</p>
</div>
<div id="key-created"></div>
<section class="card" id="key-list" hx-get="/admin/keys/list{{if .Data.Admin}}?type=admin{{end}}" hx-trigger="load, refresh from:body">
    <div class="card-b"><div class="skeleton" style="width:60%"></div></div>
</section>
{{end}}
