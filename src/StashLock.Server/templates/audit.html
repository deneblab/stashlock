{{define "content"}}
<div class="page-head"><h1>Audit log</h1><p>Every read, write and admin action, newest first. Times are shown in your local time zone; hover for UTC.</p></div>
<section class="card">
    <form class="toolbar" id="audit-filters" hx-get="/admin/audit/list" hx-target="#audit-list" hx-trigger="change, input changed delay:300ms" onsubmit="return false">
        <div class="field"><label for="a-act">Action</label>
            <select class="input" id="a-act" name="action">
                <option value="">All actions</option>
                {{range .Data.ActionGroups}}<optgroup label="{{.Label}}">{{range .Actions}}<option {{if eq . $.Data.Action}}selected{{end}}>{{.}}</option>{{end}}</optgroup>{{end}}
            </select></div>
        <div class="field"><label for="a-bt">Box key</label><input class="input mono" id="a-bt" name="box" placeholder="exampleapp.develop" autocomplete="off"></div>
        <div class="field"><label for="a-key">Key</label><input class="input" id="a-key" name="key" placeholder="Name or id" autocomplete="off"></div>
        <div class="field"><label for="a-from">From (UTC)</label><input class="input" type="date" id="a-from" name="from"></div>
        <div class="field"><label for="a-to">To (UTC)</label><input class="input" type="date" id="a-to" name="to"></div>
    </form>
    <div id="audit-list" hx-get="/admin/audit/list" hx-trigger="load" hx-include="#audit-filters">
        <div class="card-b"><div class="skeleton" style="width:60%"></div></div>
    </div>
</section>
{{end}}
