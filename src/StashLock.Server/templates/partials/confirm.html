<form hx-post="{{.Action}}" hx-swap="none">
    <div class="card-h"><h2 id="dialog-title">{{.Title}}</h2></div>
    <div class="card-b">
        <p style="margin:0">{{.Body}}</p>
        <div class="dialog-error"></div>
    </div>
    <div class="dialog-f">
        <button class="btn ghost" type="button" data-close>Cancel</button>
        <button class="btn {{if .Danger}}danger{{end}}" type="submit">{{.Confirm}}</button>
    </div>
</form>
