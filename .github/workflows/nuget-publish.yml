name: NuGet Publish

on:
  push:
    branches:
      - main
      - production

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Install abcversion tool
        run: dotnet tool install --global Deneblab.AbcVersionCmd --version 1.2.19

      - name: Get version from abcversion
        id: version
        run: |
          VERSION=$(abcversion -p semversion)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Restore Client dependencies
        run: dotnet restore src/StashLock.Client/StashLock.Client.csproj

      - name: Build Client
        run: dotnet build src/StashLock.Client/StashLock.Client.csproj --configuration Release --no-restore

      - name: Pack Client
        run: dotnet pack src/StashLock.Client/StashLock.Client.csproj --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output ./nupkg

      - name: Restore CLI dependencies
        run: dotnet restore src/StashLock.Cli/StashLock.Cli.csproj

      - name: Build CLI
        run: dotnet build src/StashLock.Cli/StashLock.Cli.csproj --configuration Release --no-restore

      - name: Pack CLI
        run: dotnet pack src/StashLock.Cli/StashLock.Cli.csproj --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output ./nupkg

      - name: Publish to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
