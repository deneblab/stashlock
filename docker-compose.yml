services:
  stashlock-server:
    image: ghcr.io/deneblab/stashlock-server:latest
    container_name: stashlock-server
    user: "1654:1654"
    ports:
      - "8099:8080"
    environment:
      - StashLock__ApiKey=${API_KEY}
      # - StashLock__AdminAllowedNetworks=100.64.0.0/10   # uncomment to restrict admin to Tailscale
      - UMASK=002
    volumes:
      - ./app/work:/app/work
      - ./app/log:/app/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
